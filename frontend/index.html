<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EV Route Planner</title>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
    #controls {
      display: flex; gap: 8px; padding: 10px;
      background: #fff; border-bottom: 1px solid #ddd; flex-shrink: 0;
    }
    #controls input {
      flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
    }
    #controls button {
      padding: 6px 16px; background: #0078d4; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    #controls button:hover { background: #005fa3; }
    #status { font-size: 13px; color: #555; align-self: center; white-space: nowrap; }
    #route-list {
      display: flex; gap: 6px; padding: 5px 10px; flex-wrap: wrap;
      background: #f8f8f8; border-bottom: 1px solid #e0e0e0; flex-shrink: 0; min-height: 32px;
    }
    .route-btn {
      padding: 3px 10px; border-radius: 10px; font-size: 12px; cursor: pointer;
      border: 1.5px solid #ccc; background: #fff; color: #666;
    }
    .route-btn.active { border-color: #0078d4; color: #0078d4; background: #e8f1fb; font-weight: 600; }
    #map { flex: 1; }
  </style>
</head>
<body>
  <div id="controls">
    <input id="from" value="益子" placeholder="from — place name or lat,lon" onfocus="focusedInput='from'">
    <input id="to"   value="宇都宮" placeholder="to — place name or lat,lon"  onfocus="focusedInput='to'">
    <button onclick="getRoute()">Route</button>
    <label style="font-size:13px;color:#555;white-space:nowrap;align-self:center">
      Start <input id="start-charge" type="number" min="0" max="100" value="100"
                   style="width:46px;padding:4px 4px;border:1px solid #ccc;border-radius:4px;font-size:13px;text-align:right"> %
    </label>
    <label style="font-size:13px;color:#555;white-space:nowrap;align-self:center;cursor:pointer">
      <input type="checkbox" id="show-onsens" onchange="applyOnsenToggle()"> ♨ Onsens
    </label>
    <span id="status"></span>
  </div>
  <div id="route-list"></div>
  <div id="map"></div>

  <script>
    const GH            = "api";
    const NOMINATIM     = "https://nominatim.openstreetmap.org/search";
    const EV_BATTERY_KWH = 82.5;

    const STRATEGIES = [
      { profile: "car_motorway", label: "Exp",   color: "#0078d4", dimColor: "#90bfe8" },
      { profile: "car_local",    label: "Local",  color: "#c47000", dimColor: "#dda860" },
    ];

    const MAX_ROUTES = 12;

    let focusedInput = "to";
    let primaryIndex = 0;
    let routes = []; // [{coords, label, summary, strategyIndex}]
    const chargerEls = new Map(); // "lat,lon" → marker element
    const hotSpringEls = [];     // all hot-spring marker elements for visibility toggle
    let activeChargerEl = null;

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [140.089, 36.476],
      zoom: 10,
    });

    map.addControl(new maplibregl.NavigationControl());

    map.on("click", (e) => {
      const layerIds = Array.from({length: MAX_ROUTES}, (_, i) => `route-${i}`);
      const hit = map.queryRenderedFeatures(e.point, { layers: layerIds });
      if (hit.length) return;
      const { lat, lng } = e.lngLat;
      document.getElementById(focusedInput).value = `${lat.toFixed(5)},${lng.toFixed(5)}`;
    });

    map.on("load", () => {
      for (let i = MAX_ROUTES - 1; i >= 0; i--) {
        map.addSource(`route-${i}`, { type: "geojson", data: emptyGeoJSON() });
        map.addLayer({
          id: `route-${i}`,
          type: "line",
          source: `route-${i}`,
          layout: { "line-join": "round", "line-cap": "round" },
          paint: { "line-color": "#999", "line-width": 2, "line-opacity": 0 },
        });
      }

      for (let i = 0; i < MAX_ROUTES; i++) {
        map.on("mouseenter", `route-${i}`, () => {
          if (routes[i] && i !== primaryIndex) map.getCanvas().style.cursor = "pointer";
        });
        map.on("mouseleave", `route-${i}`, () => { map.getCanvas().style.cursor = ""; });
        map.on("click", `route-${i}`, () => { if (routes[i] && i !== primaryIndex) promote(i); });
      }

      loadChargers();
      loadHotSprings();

      const chargeTip = new maplibregl.Popup({
        closeButton: false, closeOnClick: false, anchor: "bottom",
      });

      map.on("mousemove", (e) => {
        const layerIds = Array.from({length: MAX_ROUTES}, (_, i) => `route-${i}`);
        const hit = map.queryRenderedFeatures(e.point, { layers: layerIds });
        if (!hit.length) { chargeTip.remove(); return; }
        const idx = parseInt(hit[0].layer.id.split("-")[1]);
        const r = routes[idx];
        if (!r?.consumed_kwh?.length) return;
        const { lng, lat } = e.lngLat;
        let minD = Infinity, ptIdx = 0;
        for (let i = 0; i < r.coords.length; i++) {
          const dx = r.coords[i][0] - lng, dy = r.coords[i][1] - lat;
          const d = dx * dx + dy * dy;
          if (d < minD) { minD = d; ptIdx = i; }
        }
        const start = parseFloat(document.getElementById("start-charge").value) || 80;
        const pct = Math.min(100, Math.max(0, start - r.consumed_kwh[ptIdx] / EV_BATTERY_KWH * 100));
        chargeTip.setLngLat(e.lngLat)
          .setHTML(`<b>${pct.toFixed(1)}%</b> charge`)
          .addTo(map);
      });

      map.getCanvas().addEventListener("mouseleave", () => chargeTip.remove());
    });

    const popup = new maplibregl.Popup({ closeButton: false, maxWidth: "280px" });

    const POI_STYLES = {
      charger:    { bg: "#00b300", activeBg: "#7b2fbe" },
      hot_spring: { bg: "#e07000", activeBg: "#7b2fbe" },
    };

    function makeMarkerEl(bg) {
      const el = document.createElement("div");
      el.style.cssText = [
        "width:14px", "height:14px", "border-radius:50%",
        `background:${bg}`, "border:2px solid #fff",
        "box-shadow:0 1px 3px rgba(0,0,0,.4)", "cursor:pointer",
      ].join(";");
      return el;
    }

    async function loadChargers() {
      const r = await fetch("flash_chargers.json");
      const chargers = await r.json();
      for (const c of chargers) {
        const el = makeMarkerEl(POI_STYLES.charger.bg);
        const lines = [
          `<strong>${c.name}</strong>`,
          c.address    ? c.address : null,
          c.max_output ? `出力: ${c.max_output}` : null,
          c.hours      ? `営業: ${c.hours}` : null,
          c.closed     ? `定休: ${c.closed}` : null,
          c.connector_types ? c.connector_types.join(" / ") : null,
          c.status === "under_adjustment" ? "<em>調整中</em>" : null,
        ].filter(Boolean).join("<br>");
        new maplibregl.Marker({ element: el })
          .setLngLat([c.lon, c.lat])
          .setPopup(new maplibregl.Popup({ maxWidth: "280px" }).setHTML(lines))
          .addTo(map);
        chargerEls.set(`${c.lat},${c.lon}`, el);
      }
    }

    async function loadHotSprings() {
      try {
        const r = await fetch("hot_springs.json");
        const springs = await r.json();
        for (const s of springs) {
          const el = makeMarkerEl(POI_STYLES.hot_spring.bg);
          const lines = [
            `<strong>${s.name}</strong>`,
            s.opening_hours ? `営業: ${s.opening_hours}` : null,
            s.fee           ? `料金: ${s.fee}` : null,
            s.website       ? `<a href="${s.website}" target="_blank">website</a>` : null,
          ].filter(Boolean).join("<br>");
          new maplibregl.Marker({ element: el })
            .setLngLat([s.lon, s.lat])
            .setPopup(new maplibregl.Popup({ maxWidth: "280px" }).setHTML(lines))
            .addTo(map);
          chargerEls.set(`${s.lat},${s.lon}`, el);
          hotSpringEls.push(el);
        }
        applyOnsenToggle();
      } catch (e) { console.warn("hot_springs.json not found"); }
    }

    function applyOnsenToggle() {
      const show = document.getElementById("show-onsens").checked;
      hotSpringEls.forEach(el => { el.style.display = show ? "" : "none"; });
    }

    function emptyGeoJSON() {
      return { type: "FeatureCollection", features: [] };
    }

    function setRoute(index, coords) {
      map.getSource(`route-${index}`).setData({
        type: "Feature",
        geometry: { type: "LineString", coordinates: coords },
      });
    }

    function clearRoutes() {
      for (let i = 0; i < MAX_ROUTES; i++) {
        map.getSource(`route-${i}`).setData(emptyGeoJSON());
        map.setPaintProperty(`route-${i}`, "line-opacity", 0);
      }
      if (activeChargerEl) {
        const prev = routes[primaryIndex]?.via_poi;
        activeChargerEl.style.background = prev
          ? (POI_STYLES[prev.type]?.bg ?? "#00b300")
          : "#00b300";
        activeChargerEl = null;
      }
    }

    function styleRoute(index, active) {
      const r = routes[index];
      if (!r) return;
      let color, dimColor;
      if (r.via_poi) {
        color = "#7b2fbe"; dimColor = "#b48fd4";
      } else {
        const s = STRATEGIES[r.strategyIndex];
        color = s.color; dimColor = s.dimColor;
      }
      map.setPaintProperty(`route-${index}`, "line-color", active ? color : dimColor);
      map.setPaintProperty(`route-${index}`, "line-width", active ? 4 : 2);
      map.setPaintProperty(`route-${index}`, "line-opacity", active ? 1 : 0.7);
    }

    function promote(index) {
      styleRoute(primaryIndex, false);
      styleRoute(index, true);
      map.moveLayer(`route-${index}`);
      primaryIndex = index;
      document.querySelectorAll(".route-btn").forEach((btn, i) => {
        btn.classList.toggle("active", i === index);
      });
      document.getElementById("status").textContent = routes[index].summary;

      if (activeChargerEl) {
        const prev = routes[primaryIndex]?.via_poi;
        activeChargerEl.style.background = prev
          ? (POI_STYLES[prev.type]?.bg ?? "#00b300")
          : "#00b300";
        activeChargerEl = null;
      }
      const poi = routes[index]?.via_poi;
      if (poi) {
        const el = chargerEls.get(`${poi.lat},${poi.lon}`);
        if (el) { el.style.background = "#7b2fbe"; activeChargerEl = el; }
      }
    }

    function fmtTime(ms) {
      const mins = Math.round(ms / 60000);
      const h = Math.floor(mins / 60), m = mins % 60;
      return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m`;
    }

    function summarise(path) {
      const km = (path.distance / 1000).toFixed(1);
      const ghTime = fmtTime(path.time);
      const timeStr = path.scored_time_ms != null
        ? `GH ${ghTime} / GPS ${fmtTime(path.scored_time_ms)}`
        : ghTime;
      const tollStr = path.toll_jpy != null ? ` · ¥${path.toll_jpy.toLocaleString()}` : "";
      let chargeStr = "";
      if (path.consumed_kwh?.length) {
        const start = parseFloat(document.getElementById("start-charge").value) || 80;
        const dest  = Math.min(100, Math.max(0, start - path.consumed_kwh.at(-1) / EV_BATTERY_KWH * 100));
        chargeStr = ` · →${dest.toFixed(0)}%`;
      }
      if (path.via_poi) {
        const p = path.via_poi;
        const extra = p.max_output ? ` ${p.max_output}` : "";
        return `${km} km · ${timeStr}${tollStr}${chargeStr} · via ${p.name}${extra}`;
      }
      return `${km} km · ${timeStr}${tollStr}${chargeStr}`;
    }

    async function resolve(query) {
      const m = query.match(/^(-?\d+\.?\d*),\s*(-?\d+\.?\d*)$/);
      if (m) return [parseFloat(m[1]), parseFloat(m[2])];
      const params = new URLSearchParams({ q: query, format: "json", countrycodes: "jp", limit: 1 });
      const r = await fetch(`${NOMINATIM}?${params}`);
      if (!r.ok) throw new Error(`Geocoding error ${r.status}`);
      const results = await r.json();
      if (!results.length) throw new Error(`No results for: ${query}`);
      return [parseFloat(results[0].lat), parseFloat(results[0].lon)];
    }

    function pathsToRoutes(paths, strategyIndex) {
      const s = STRATEGIES[strategyIndex];
      return paths.map((path, j) => ({
        coords:       path.points.coordinates,
        summary:      summarise(path),
        label:        (() => {
                        if (!path.via_poi) return j === 0 ? s.label : `${s.label} ${j + 1}`;
                        const poi = path.via_poi;
                        const icon = poi.type === "hot_spring" ? "♨" : "⚡";
                        let lbl = `${icon} ${poi.name}`;
                        if (poi.secondary) {
                          const icon2 = poi.secondary.type === "hot_spring" ? "♨" : "⚡";
                          lbl += ` + ${icon2}`;
                        }
                        return lbl;
                      })(),
        strategyIndex,
        via_poi:      path.via_poi || null,
        consumed_kwh: path.consumed_kwh || null,
      }));
    }

    async function fetchStrategy(from, to, strategyIndex, onBatch) {
      const s = STRATEGIES[strategyIndex];
      try {
        const r = await fetch(`${GH}/route`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            points: [[from[1], from[0]], [to[1], to[0]]],
            profile: s.profile,
            start_charge_pct: parseFloat(document.getElementById("start-charge").value) || 80,
            poi_types: document.getElementById("show-onsens").checked
              ? ["charger", "hot_spring"] : ["charger"],
          }),
        });
        if (!r.ok) return;
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let nl;
          while ((nl = buf.indexOf("\n")) !== -1) {
            const line = buf.slice(0, nl).trim();
            buf = buf.slice(nl + 1);
            if (line) onBatch(pathsToRoutes(JSON.parse(line).paths, strategyIndex));
          }
        }
        if (buf.trim()) onBatch(pathsToRoutes(JSON.parse(buf).paths, strategyIndex));
      } catch (e) {
        console.warn("fetchStrategy error:", e);
      }
    }

    function fitToAllRoutes() {
      const allCoords = routes.flatMap(r => r.coords);
      if (!allCoords.length) return;
      const bounds = allCoords.reduce(
        (b, c) => b.extend(c),
        new maplibregl.LngLatBounds(allCoords[0], allCoords[0])
      );
      map.fitBounds(bounds, { padding: 60 });
    }

    async function getRoute() {
      const status  = document.getElementById("status");
      const fromVal = document.getElementById("from").value.trim();
      const toVal   = document.getElementById("to").value.trim();

      status.textContent = "Geocoding…";
      let from, to;
      try {
        [from, to] = await Promise.all([resolve(fromVal), resolve(toVal)]);
      } catch (e) {
        status.textContent = e.message;
        return;
      }

      clearRoutes();
      routes = [];
      primaryIndex = 0;
      document.getElementById("route-list").innerHTML = "<span style='color:#999;font-size:12px'>Loading…</span>";
      status.textContent = "Routing…";

      let fitted = false;

      function addBatch(newRoutes) {
        const available = MAX_ROUTES - routes.length;
        if (!available) return;
        const toAdd = newRoutes.slice(0, available);
        const startIdx = routes.length;
        routes.push(...toAdd);
        toAdd.forEach((r, j) => {
          const i = startIdx + j;
          setRoute(i, r.coords);
          styleRoute(i, i === 0);
        });
        if (!fitted) { fitted = true; fitToAllRoutes(); }
        status.textContent = routes[0].summary;
        document.getElementById("route-list").innerHTML = routes.map((r, i) =>
          `<button class="route-btn${i === primaryIndex ? " active" : ""}" onclick="promote(${i})">
             ${r.label} · ${r.summary}
           </button>`
        ).join("");
      }

      await Promise.all(STRATEGIES.map((_, i) => fetchStrategy(from, to, i, addBatch)));

      if (!routes.length) {
        status.textContent = "No routes found";
        document.getElementById("route-list").innerHTML = "";
      }
    }
  </script>
</body>
</html>
