<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EV Route Planner</title>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
    #controls {
      display: flex; gap: 8px; padding: 10px;
      background: #fff; border-bottom: 1px solid #ddd; flex-shrink: 0;
    }
    #controls input {
      flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
    }
    #controls button {
      padding: 6px 16px; background: #0078d4; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    #controls button:hover { background: #005fa3; }
    #status { font-size: 13px; color: #555; align-self: center; white-space: nowrap; }
    #map { flex: 1; }
  </style>
</head>
<body>
  <div id="controls">
    <input id="from" value="益子" placeholder="from — place name or lat,lon" onfocus="focusedInput='from'">
    <input id="to"   value="宇都宮" placeholder="to — place name or lat,lon"  onfocus="focusedInput='to'">
    <button onclick="getRoute()">Route</button>
    <span id="status"></span>
  </div>
  <div id="map"></div>

  <script>
    const GH        = "gh";
    const NOMINATIM = "https://nominatim.openstreetmap.org/search";

    const MAX_ROUTES    = 3;
    const COLOR_PRIMARY = "#0078d4";
    const COLOR_ALT     = "#999";

    let focusedInput = "to";
    let primaryIndex = 0;

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [140.089, 36.476],
      zoom: 10,
    });

    map.addControl(new maplibregl.NavigationControl());

    map.on("click", (e) => {
      // Don't populate input if the click landed on a route line
      const hit = map.queryRenderedFeatures(e.point, {
        layers: Array.from({ length: MAX_ROUTES }, (_, i) => `route-${i}`),
      });
      if (hit.length) return;
      const { lat, lng } = e.lngLat;
      document.getElementById(focusedInput).value =
        `${lat.toFixed(5)},${lng.toFixed(5)}`;
    });

    map.on("load", () => {
      // Add alternatives first so primary renders on top
      for (let i = MAX_ROUTES - 1; i >= 0; i--) {
        map.addSource(`route-${i}`, { type: "geojson", data: emptyGeoJSON() });
        map.addLayer({
          id: `route-${i}`,
          type: "line",
          source: `route-${i}`,
          layout: { "line-join": "round", "line-cap": "round" },
          paint: {
            "line-color": i === 0 ? COLOR_PRIMARY : COLOR_ALT,
            "line-width": i === 0 ? 4 : 3,
            "line-opacity": i === 0 ? 1 : 0.6,
          },
        });
      }

      for (let i = 0; i < MAX_ROUTES; i++) {
        map.on("mouseenter", `route-${i}`, () => {
          if (i !== primaryIndex) map.getCanvas().style.cursor = "pointer";
        });
        map.on("mouseleave", `route-${i}`, () => {
          map.getCanvas().style.cursor = "";
        });
        if (i > 0) {
          map.on("click", `route-${i}`, () => promote(i));
        }
      }
    });

    function emptyGeoJSON() {
      return { type: "FeatureCollection", features: [] };
    }

    function setRoute(index, coords) {
      map.getSource(`route-${index}`).setData({
        type: "Feature",
        geometry: { type: "LineString", coordinates: coords },
      });
    }

    function clearRoutes() {
      for (let i = 0; i < MAX_ROUTES; i++) {
        map.getSource(`route-${i}`).setData(emptyGeoJSON());
      }
      // Reset all styles to defaults
      promote(0, true);
    }

    function promote(index, silent = false) {
      if (!silent) {
        map.setPaintProperty(`route-${primaryIndex}`, "line-color", COLOR_ALT);
        map.setPaintProperty(`route-${primaryIndex}`, "line-width", 3);
        map.setPaintProperty(`route-${primaryIndex}`, "line-opacity", 0.6);
      }
      map.setPaintProperty(`route-${index}`, "line-color", COLOR_PRIMARY);
      map.setPaintProperty(`route-${index}`, "line-width", 4);
      map.setPaintProperty(`route-${index}`, "line-opacity", 1);
      map.moveLayer(`route-${index}`);
      primaryIndex = index;
    }

    function fitToCoords(coords) {
      const bounds = coords.reduce(
        (b, c) => b.extend(c),
        new maplibregl.LngLatBounds(coords[0], coords[0])
      );
      map.fitBounds(bounds, { padding: 60 });
    }

    function summarise(path) {
      const km   = (path.distance / 1000).toFixed(1);
      const mins = Math.round(path.time / 60000);
      const h = Math.floor(mins / 60), m = mins % 60;
      const time = h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m`;
      return `${km} km · ${time}`;
    }

    async function resolve(query) {
      const m = query.match(/^(-?\d+\.?\d*),\s*(-?\d+\.?\d*)$/);
      if (m) return [parseFloat(m[1]), parseFloat(m[2])];
      const params = new URLSearchParams({
        q: query, format: "json", countrycodes: "jp", limit: 1,
      });
      const r = await fetch(`${NOMINATIM}?${params}`);
      if (!r.ok) throw new Error(`Geocoding error ${r.status}`);
      const results = await r.json();
      if (!results.length) throw new Error(`No results for: ${query}`);
      return [parseFloat(results[0].lat), parseFloat(results[0].lon)];
    }

    function routeParams(from, to, extra = {}) {
      const p = new URLSearchParams({ profile: "car", points_encoded: "false", ...extra });
      p.append("point", `${from[0]},${from[1]}`);
      p.append("point", `${to[0]},${to[1]}`);
      return p;
    }

    async function fetchAlternatives(from, to) {
      const r = await fetch(`${GH}/route?` + routeParams(from, to, {
        algorithm: "alternative_route",
        "alternative_route.max_paths": MAX_ROUTES,
      }));
      if (!r.ok) return;
      const data = await r.json();
      // paths[0] duplicates the primary we already drew — skip it
      for (let i = 1; i < data.paths.length; i++) {
        setRoute(i, data.paths[i].points.coordinates);
      }
    }

    async function getRoute() {
      const status   = document.getElementById("status");
      const fromVal  = document.getElementById("from").value.trim();
      const toVal    = document.getElementById("to").value.trim();

      status.textContent = "Geocoding…";
      let from, to;
      try {
        [from, to] = await Promise.all([resolve(fromVal), resolve(toVal)]);
      } catch (e) {
        status.textContent = e.message;
        return;
      }

      clearRoutes();
      primaryIndex = 0;

      status.textContent = "Routing…";
      let data;
      try {
        const r = await fetch(`${GH}/route?` + routeParams(from, to));
        if (!r.ok) throw new Error(`GraphHopper error ${r.status}`);
        data = await r.json();
      } catch (e) {
        status.textContent = `Error: ${e.message}`;
        return;
      }

      const path = data.paths[0];
      setRoute(0, path.points.coordinates);
      fitToCoords(path.points.coordinates);
      status.textContent = summarise(path);

      // Fetch alternatives without awaiting — populates when ready
      fetchAlternatives(from, to);
    }
  </script>
</body>
</html>
