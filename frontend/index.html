<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EV Route Planner</title>
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
    #controls {
      display: flex; gap: 8px; padding: 10px;
      background: #fff; flex-shrink: 0;
    }
    #controls input {
      flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
    }
    #controls button {
      padding: 6px 16px; background: #0078d4; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    #controls button:hover { background: #005fa3; }
    #status {
      padding: 5px 10px; background: #fff; border-bottom: 1px solid #eee;
      font-size: 13px; color: #555; flex-shrink: 0; min-height: 26px;
    }
    #route-bar {
      display: flex; align-items: flex-start; flex-shrink: 0;
      background: #f8f8f8; border-bottom: 1px solid #e0e0e0;
    }
    #route-list {
      display: flex; gap: 6px; padding: 5px 10px; flex-wrap: wrap; flex: 1; min-height: 32px;
    }
    #route-bar.collapsed #route-list { display: none; }
    #list-toggle {
      padding: 4px 8px; border: none; background: transparent;
      cursor: pointer; font-size: 13px; color: #999; flex-shrink: 0;
      align-self: flex-end; margin-left: auto;
    }
    #list-toggle:hover { color: #555; }
    .route-btn {
      padding: 3px 10px; border-radius: 10px; font-size: 12px; cursor: pointer;
      border: 1.5px solid #ccc; background: #fff; color: #666;
    }
    .route-btn.active { border-color: #0078d4; color: #0078d4; background: #e8f1fb; font-weight: 600; }
    #map { flex: 1; }
    #progress {
      display: flex; align-items: center; gap: 7px;
      padding: 4px 10px; font-size: 12px; color: #666;
      background: #f0f4ff; border-bottom: 1px solid #d8e4f8; flex-shrink: 0;
    }
    #progress[hidden] { display: none; }
    #progress::before {
      content: ""; flex-shrink: 0;
      width: 11px; height: 11px; border-radius: 50%;
      border: 2px solid #c0d0f0; border-top-color: #0078d4;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="controls">
    <input id="from" value="益子" placeholder="from — place name or lat,lon">
    <input id="to"   value="宇都宮" placeholder="to — place name or lat,lon">
    <button onclick="getRoute()">Route</button>
    <label style="font-size:13px;color:#555;white-space:nowrap;align-self:center">
      Start <input id="start-charge" type="number" min="0" max="100" value="100"
                   style="width:46px;padding:4px 4px;border:1px solid #ccc;border-radius:4px;font-size:13px;text-align:right"> %
    </label>
    <label style="font-size:13px;color:#555;white-space:nowrap;align-self:center;cursor:pointer">
      <input type="checkbox" id="show-onsens" onchange="applyOnsenToggle()"> ♨ Onsens
    </label>
    <input id="interest" placeholder="✨ Interests (e.g. impressive waterfalls)"
           style="width:240px" title="Describe what you'd like to see on the way">
  </div>
  <div id="status"></div>
  <div id="progress" hidden></div>
  <div id="route-bar">
    <div id="route-list"></div>
    <button id="list-toggle" onclick="toggleRouteList()" title="Collapse route list">▼</button>
  </div>
  <div id="map"></div>

  <script>
    const GH            = "api";
    const NOMINATIM     = "https://nominatim.openstreetmap.org/search";
    const EV_BATTERY_KWH = 82.5;

    const STRATEGIES = [
      { profile: "car_motorway", label: "Exp",   color: "#0078d4", dimColor: "#5ea8db" },
      { profile: "car_local",    label: "Local",  color: "#c47000", dimColor: "#d99440" },
    ];

    const MAX_ROUTES = 12;

    let primaryIndex = 0;
    let routes = []; // [{coords, label, summary, strategyIndex}]
    const chargerEls = new Map(); // "lat,lon" → marker element
    const hotSpringEls = [];     // all hot-spring marker elements for visibility toggle
    let activeChargerEl = null;
    const candidateEls = new Set(); // marker elements currently highlighted as route candidates
    const candidateData = new Map(); // el → {type,lat,lon,data} for click-to-pin
    const pinnedEls = new Set();    // marker elements pinned by the user (stay purple)
    let pinnedStops = [];           // [{type,lat,lon,data}] in order
    const interestMarkers = new Map(); // "lat,lon" → MapLibre Marker (dynamic, cleared per query)
    const interestPOIs = new Map();    // "lat,lon" → mutable poi dict (for post-render enrichment)
    let activeInterestEl = null;
    let interestEmoji = "✨";
    let clickCycle = null; // { key: string, indices: number[], pos: number }
    let lastFocusedInput = null; // track which input was last focused for map-click-to-fill
    let lastFrom = null, lastTo = null; // cached geocoded coords from most recent getRoute call

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [140.089, 36.476],
      zoom: 10,
    });

    map.addControl(new maplibregl.NavigationControl());

    const routeLayerIds = Array.from({length: MAX_ROUTES}, (_, i) => `route-${i}`);

    map.on("click", (e) => {
      const hits = map.queryRenderedFeatures(e.point, { layers: routeLayerIds });
      const hitIndices = [...new Set(hits.map(f => parseInt(f.layer.id.split("-")[1])))].filter(i => routes[i]);

      if (!hitIndices.length) {
        clickCycle = null;
        if (lastFocusedInput) {
          const { lat, lng } = e.lngLat;
          lastFocusedInput.value = `${lat.toFixed(5)},${lng.toFixed(5)}`;
        }
        return;
      }

      const key = hitIndices.join(",");
      if (clickCycle?.key === key) {
        clickCycle.pos = (clickCycle.pos + 1) % hitIndices.length;
      } else {
        // First click at this spot: start just after the current primary (if present)
        const primaryPos = hitIndices.indexOf(primaryIndex);
        clickCycle = { key, indices: hitIndices, pos: (primaryPos + 1) % hitIndices.length };
      }
      promote(hitIndices[clickCycle.pos]);
    });

    map.on("load", () => {
      for (let i = MAX_ROUTES - 1; i >= 0; i--) {
        map.addSource(`route-${i}`, { type: "geojson", data: emptyGeoJSON() });
        map.addLayer({
          id: `route-${i}`,
          type: "line",
          source: `route-${i}`,
          layout: { "line-join": "round", "line-cap": "round" },
          paint: { "line-color": "#999", "line-width": 2, "line-opacity": 0 },
        });
      }

      for (let i = 0; i < MAX_ROUTES; i++) {
        map.on("mouseenter", `route-${i}`, () => {
          if (routes[i]) map.getCanvas().style.cursor = "pointer";
        });
        map.on("mouseleave", `route-${i}`, () => { map.getCanvas().style.cursor = ""; });
      }

      loadChargers();
      loadHotSprings();

      const chargeTip = new maplibregl.Popup({
        closeButton: false, closeOnClick: false, anchor: "bottom",
      });

      map.on("mousemove", (e) => {
        const layerIds = Array.from({length: MAX_ROUTES}, (_, i) => `route-${i}`);
        const hit = map.queryRenderedFeatures(e.point, { layers: layerIds });
        if (!hit.length) { chargeTip.remove(); return; }
        const idx = parseInt(hit[0].layer.id.split("-")[1]);
        const r = routes[idx];
        if (!r?.consumed_kwh?.length) return;
        const { lng, lat } = e.lngLat;
        let minD = Infinity, ptIdx = 0;
        for (let i = 0; i < r.coords.length; i++) {
          const dx = r.coords[i][0] - lng, dy = r.coords[i][1] - lat;
          const d = dx * dx + dy * dy;
          if (d < minD) { minD = d; ptIdx = i; }
        }
        const start = parseFloat(document.getElementById("start-charge").value) || 80;
        const pct = Math.min(100, Math.max(0, start - r.consumed_kwh[ptIdx] / EV_BATTERY_KWH * 100));
        chargeTip.setLngLat(e.lngLat)
          .setHTML(`<b>${pct.toFixed(1)}%</b> charge`)
          .addTo(map);
      });

      map.getCanvas().addEventListener("mouseleave", () => chargeTip.remove());

      if (window.location.hash.startsWith("#!")) getRoute({ pushHistory: false });

      // Track which text input was last focused so map clicks can fill it.
      // Blur fires before the map click event, so we keep lastFocusedInput alive
      // briefly with a timeout to let the click handler see it.
      let _blurTimer = null;
      for (const id of ["from", "to"]) {
        const el = document.getElementById(id);
        el.addEventListener("focus", () => {
          clearTimeout(_blurTimer);
          lastFocusedInput = el;
        });
        el.addEventListener("blur", () => {
          _blurTimer = setTimeout(() => { lastFocusedInput = null; }, 200);
        });
      }
    });

    const popup = new maplibregl.Popup({ closeButton: false, maxWidth: "280px" });

    function hoverPopup(marker) {
      const el = marker.getElement();
      let timer = null;
      const scheduleClose = () => {
        timer = setTimeout(() => { if (marker.getPopup().isOpen()) marker.togglePopup(); }, 150);
      };
      const cancelClose = () => { clearTimeout(timer); };
      el.addEventListener("mouseenter", () => { cancelClose(); if (!marker.getPopup().isOpen()) marker.togglePopup(); });
      el.addEventListener("mouseleave", scheduleClose);
      marker.getPopup().on("open", () => {
        const popupEl = marker.getPopup().getElement();
        if (!popupEl) return;
        popupEl.addEventListener("mouseenter", cancelClose);
        popupEl.addEventListener("mouseleave", scheduleClose);
      });
    }

    function makePoiMarkerEl(emoji, active, candidate = false) {
      const el = document.createElement("div");
      el.textContent = emoji;
      el.dataset.emoji = emoji;
      if (active) {
        el.style.cssText = [
          "font-size:20px", "line-height:1", "cursor:pointer", "user-select:none",
          "background:rgba(255,255,255,0.92)", "border:2.5px solid rgba(100,60,180,0.9)",
          "border-radius:6px", "padding:2px 5px",
          "filter:drop-shadow(0 1px 4px rgba(0,0,0,.55))",
        ].join(";");
      } else if (candidate) {
        el.style.cssText = [
          "font-size:18px", "line-height:1", "cursor:pointer", "user-select:none",
          "border:2.5px solid rgba(220,140,0,0.9)", "border-radius:50%", "padding:3px",
          "box-shadow:0 1px 4px rgba(0,0,0,.5)",
        ].join(";");
      } else {
        el.style.cssText = [
          "font-size:15px", "line-height:1", "cursor:pointer", "user-select:none",
          "border:2px solid rgba(30,30,30,0.7)", "border-radius:50%", "padding:3px",
          "box-shadow:0 1px 3px rgba(0,0,0,.45)",
        ].join(";");
      }
      return el;
    }

    function clearCandidates() {
      candidateEls.forEach(el => {
        if (!pinnedEls.has(el))
          el.style.cssText = makePoiMarkerEl(el.dataset.emoji || "⚡", false).style.cssText;
      });
      candidateEls.clear();
      candidateData.clear();
    }

    function setCandidates(candidates) {
      clearCandidates();
      for (const c of candidates) {
        const key = `${c.lat},${c.lon}`;
        const el = c.type === "interest"
          ? interestMarkers.get(key)?.getElement()
          : chargerEls.get(key);
        if (!el || pinnedEls.has(el)) continue;
        el.style.cssText = makePoiMarkerEl(el.dataset.emoji || "⚡", false, true).style.cssText;
        candidateEls.add(el);
        candidateData.set(el, c);
        el.addEventListener("click", function onPin(e) {
          e.stopPropagation();
          el.removeEventListener("click", onPin);
          candidateEls.delete(el);
          candidateData.delete(el);
          // Promote to pinned style
          el.style.cssText = makePoiMarkerEl(el.dataset.emoji || "⚡", true).style.cssText;
          el.dataset.pinned = "true";
          pinnedEls.add(el);
          pinnedStops.push({type: c.type, lat: c.lat, lon: c.lon, data: c.data});
          const fromVal = document.getElementById("from").value.trim();
          const toVal   = document.getElementById("to").value.trim();
          history.pushState(null, "", _buildHash(fromVal, toVal));
          appendViaStopRoutes();
        });
      }
    }

    function makeInterestMarkerEl(active) { return makePoiMarkerEl(interestEmoji, active); }

    function clearInterestMarkers() {
      if (activeInterestEl) { activeInterestEl = null; }
      interestMarkers.forEach(m => m.remove());
      interestMarkers.clear();
      interestPOIs.clear();
    }

    function poiPopupHTML(poi) {
      const linkParts = [
        poi.website   ? `<a href="${poi.website}" target="_blank" rel="noopener">website</a>` : null,
        poi.wikipedia ? `<a href="${poi.wikipedia}" target="_blank" rel="noopener">Wikipedia</a>` : null,
      ].filter(Boolean);
      return [
        poi.name_en ? `<strong>${poi.name_en}</strong>` : `<strong>${poi.name || ""}</strong>`,
        poi.name_en && poi.name ? `<em>${poi.name}</em>` : null,
        poi.description || null,
        linkParts.length ? linkParts.join(" · ") : null,
      ].filter(Boolean).join("<br>");
    }

    function showInterestPOIs(pois) {
      const seen = new Set(interestMarkers.keys());
      for (const poi of pois) {
        const key = `${poi.lat},${poi.lon}`;
        if (seen.has(key)) continue;
        seen.add(key);
        const el = makeInterestMarkerEl(false);
        const marker = new maplibregl.Marker({ element: el })
          .setLngLat([poi.lon, poi.lat])
          .setPopup(new maplibregl.Popup({ maxWidth: "260px", closeButton: false, closeOnClick: false }).setHTML(poiPopupHTML(poi)))
          .addTo(map);
        hoverPopup(marker);
        interestMarkers.set(key, marker);
        interestPOIs.set(key, poi);
      }
      highlightActiveInterest();
      enrichWithWikipedia(pois);
    }

    function _wikiTitleMatches(title, term) {
      const t = title.toLowerCase(), s = term.toLowerCase();
      if (t === s || t.includes(s) || s.includes(t)) return true;
      // English: at least one significant word in common
      const tWords = new Set(t.split(/\s+/).filter(w => w.length > 2));
      if (s.split(/\s+/).some(w => w.length > 2 && tWords.has(w))) return true;
      // Japanese/CJK: at least one 2-character sequence in common
      for (let i = 0; i < s.length - 1; i++) {
        if (/[　-鿿]/.test(s[i]) && t.includes(s.slice(i, i + 2))) return true;
      }
      return false;
    }

    async function enrichWithWikipedia(pois) {
      const unlinked = pois.filter(p => !p.wikipedia && (p.name || p.name_en));
      for (const poi of unlinked) {
        const key = `${poi.lat},${poi.lon}`;
        if (!interestMarkers.has(key)) continue; // markers cleared (new search started)
        try {
          // Try Japanese name first, fall back to English
          const searches = [poi.name, poi.name_en].filter(Boolean);
          let wikiUrl = null;
          for (const term of searches) {
            const lang = term === poi.name ? "ja" : "en";
            const params = new URLSearchParams({ action: "query", list: "search", srsearch: term,
              format: "json", origin: "*", srlimit: 3, srnamespace: 0 });
            const data = await fetch(`https://${lang}.wikipedia.org/w/api.php?${params}`).then(r => r.json());
            const hit = (data?.query?.search || []).find(h => _wikiTitleMatches(h.title, term));
            if (hit) {
              wikiUrl = `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(hit.title).replace(/%20/g, "_")}`;
              break;
            }
          }
          if (!wikiUrl || !interestMarkers.has(key)) continue;
          poi.wikipedia = wikiUrl;
          interestMarkers.get(key).getPopup().setHTML(poiPopupHTML(poi));
        } catch (_) { /* ignore network errors */ }
      }
    }

    function highlightActiveInterest() {
      if (activeInterestEl) {
        if (!pinnedEls.has(activeInterestEl))
          activeInterestEl.style.cssText = makeInterestMarkerEl(false).style.cssText;
        activeInterestEl = null;
      }
      const poi = routes[primaryIndex]?.via_poi;
      if (poi?.type === "interest") {
        const m = interestMarkers.get(`${poi.lat},${poi.lon}`);
        if (m) {
          const el = m.getElement();
          if (!pinnedEls.has(el)) {
            el.style.cssText = makeInterestMarkerEl(true).style.cssText;
            activeInterestEl = el;
          }
        }
      }
    }

    async function loadChargers() {
      const r = await fetch("flash_chargers.json");
      const chargers = await r.json();
      for (const c of chargers) {
        const el = makePoiMarkerEl("⚡", false);
        const lines = [
          `<strong>${c.name}</strong>`,
          c.address    ? c.address : null,
          c.max_output ? `出力: ${c.max_output}` : null,
          c.hours      ? `営業: ${c.hours}` : null,
          c.closed     ? `定休: ${c.closed}` : null,
          c.connector_types ? c.connector_types.join(" / ") : null,
          c.status === "under_adjustment" ? "<em>調整中</em>" : null,
        ].filter(Boolean).join("<br>");
        hoverPopup(new maplibregl.Marker({ element: el })
          .setLngLat([c.lon, c.lat])
          .setPopup(new maplibregl.Popup({ maxWidth: "280px", closeButton: false, closeOnClick: false }).setHTML(lines))
          .addTo(map));
        chargerEls.set(`${c.lat},${c.lon}`, el);
      }
    }

    async function loadHotSprings() {
      try {
        const r = await fetch("hot_springs.json");
        const springs = await r.json();
        for (const s of springs) {
          const el = makePoiMarkerEl("♨", false);
          const lines = [
            `<strong>${s.name}</strong>`,
            s.opening_hours ? `営業: ${s.opening_hours}` : null,
            s.fee           ? `料金: ${s.fee}` : null,
            s.website       ? `<a href="${s.website}" target="_blank">website</a>` : null,
          ].filter(Boolean).join("<br>");
          hoverPopup(new maplibregl.Marker({ element: el })
            .setLngLat([s.lon, s.lat])
            .setPopup(new maplibregl.Popup({ maxWidth: "280px", closeButton: false, closeOnClick: false }).setHTML(lines))
            .addTo(map));
          chargerEls.set(`${s.lat},${s.lon}`, el);
          hotSpringEls.push(el);
        }
        applyOnsenToggle();
      } catch (e) { console.warn("hot_springs.json not found"); }
    }

    function applyOnsenToggle() {
      const show = document.getElementById("show-onsens").checked;
      hotSpringEls.forEach(el => { el.style.display = show ? "" : "none"; });
    }

    function showProgress(msg) {
      const el = document.getElementById("progress");
      el.textContent = msg;
      el.hidden = false;
    }

    function clearProgress() {
      document.getElementById("progress").hidden = true;
    }

    function toggleRouteList() {
      const bar = document.getElementById("route-bar");
      const btn = document.getElementById("list-toggle");
      const collapsed = bar.classList.toggle("collapsed");
      btn.textContent = collapsed ? "▲" : "▼";
      btn.title = collapsed ? "Expand route list" : "Collapse route list";
    }

    function loadFromHash() {
      const hash = window.location.hash;
      if (!hash.startsWith("#!")) return false;
      const p = new URLSearchParams(hash.slice(2));
      const from = p.get("from"), to = p.get("to");
      if (!from || !to) return false;
      document.getElementById("from").value = from;
      document.getElementById("to").value   = to;
      if (p.has("charge")) document.getElementById("start-charge").value = p.get("charge");
      if (p.has("onsens")) {
        document.getElementById("show-onsens").checked = p.get("onsens") === "1";
        applyOnsenToggle();
      }
      if (p.has("interest")) document.getElementById("interest").value = p.get("interest");
      const pinsParam = p.get("pins");
      if (pinsParam) {
        try {
          pinnedStops = JSON.parse(pinsParam).map(([type, lat, lon, name, name_en]) => ({
            type, lat, lon, data: { name, name_en }
          }));
        } catch { pinnedStops = []; }
      } else {
        pinnedStops = [];
      }
      return true;
    }

    function _decodePinsFromHash() {
      const hash = window.location.hash;
      if (!hash.startsWith("#!")) return [];
      const p = new URLSearchParams(hash.slice(2));
      const pinsParam = p.get("pins");
      if (!pinsParam) return [];
      try {
        return JSON.parse(pinsParam).map(([type, lat, lon, name, name_en]) => ({
          type, lat, lon, data: { name, name_en }
        }));
      } catch { return []; }
    }

    // Populate fields immediately (before map finishes loading)
    loadFromHash();

    window.addEventListener("popstate", () => {
      const pins = _decodePinsFromHash();
      if (loadFromHash()) getRoute({ pushHistory: false, restoredPins: pins });
    });

    function emptyGeoJSON() {
      return { type: "FeatureCollection", features: [] };
    }

    function setRoute(index, coords) {
      map.getSource(`route-${index}`).setData({
        type: "Feature",
        geometry: { type: "LineString", coordinates: coords },
      });
    }

    function clearRoutes() {
      for (let i = 0; i < MAX_ROUTES; i++) {
        map.getSource(`route-${i}`).setData(emptyGeoJSON());
        map.setPaintProperty(`route-${i}`, "line-opacity", 0);
      }
      if (activeChargerEl && !pinnedEls.has(activeChargerEl)) {
        activeChargerEl.style.cssText = makePoiMarkerEl(activeChargerEl.dataset.emoji || "⚡", false).style.cssText;
      }
      activeChargerEl = null;
      if (activeInterestEl && !pinnedEls.has(activeInterestEl)) {
        activeInterestEl.style.cssText = makeInterestMarkerEl(false).style.cssText;
      }
      activeInterestEl = null;
      clearCandidates();
      clearInterestMarkers();
      interestEmoji = "✨";
      clickCycle = null;
    }

    // Re-apply purple style to any markers that match the current pinnedStops list.
    // Safe to call multiple times; called after charger load and after interest POIs appear.
    function restorePinnedVisuals() {
      for (const stop of pinnedStops) {
        const key = `${stop.lat},${stop.lon}`;
        const el = stop.type === "interest"
          ? interestMarkers.get(key)?.getElement()
          : chargerEls.get(key);
        if (!el || pinnedEls.has(el)) continue;
        el.style.cssText = makePoiMarkerEl(el.dataset.emoji || "⚡", true).style.cssText;
        el.dataset.pinned = "true";
        pinnedEls.add(el);
      }
    }

    function styleRoute(index, active) {
      const r = routes[index];
      if (!r) return;
      let color, dimColor;
      if (r.via_poi) {
        color = "#7b2fbe"; dimColor = "#9e68c8";
      } else {
        const s = STRATEGIES[r.strategyIndex];
        color = s.color; dimColor = s.dimColor;
      }
      map.setPaintProperty(`route-${index}`, "line-color", active ? color : dimColor);
      map.setPaintProperty(`route-${index}`, "line-width", active ? 6 : 3);
      map.setPaintProperty(`route-${index}`, "line-opacity", active ? 1 : 0.65);
    }

    function promote(index) {
      const oldIndex = primaryIndex;
      styleRoute(oldIndex, false);
      styleRoute(index, true);
      map.moveLayer(`route-${index}`);
      primaryIndex = index;
      document.querySelectorAll(".route-btn").forEach((btn, i) => {
        btn.classList.toggle("active", i === index);
      });
      document.getElementById("status").textContent = routes[index].summary;

      if (activeChargerEl) {
        if (!pinnedEls.has(activeChargerEl)) {
          const emoji = activeChargerEl.dataset.emoji || "⚡";
          activeChargerEl.style.cssText = makePoiMarkerEl(emoji, false).style.cssText;
        }
        activeChargerEl = null;
      }
      const poi = routes[index]?.via_poi;
      if (poi) {
        if (poi.type === "interest") {
          highlightActiveInterest();
        } else {
          if (activeInterestEl) {
            if (!pinnedEls.has(activeInterestEl))
              activeInterestEl.style.cssText = makeInterestMarkerEl(false).style.cssText;
            activeInterestEl = null;
          }
          const el = chargerEls.get(`${poi.lat},${poi.lon}`);
          if (el && !pinnedEls.has(el)) {
            const emoji = el.dataset.emoji || "⚡";
            el.style.cssText = makePoiMarkerEl(emoji, true).style.cssText;
            activeChargerEl = el;
          }
        }
      } else {
        if (activeInterestEl) {
          if (!pinnedEls.has(activeInterestEl))
            activeInterestEl.style.cssText = makeInterestMarkerEl(false).style.cssText;
          activeInterestEl = null;
        }
      }
    }

    function fmtTime(ms) {
      const mins = Math.round(ms / 60000);
      const h = Math.floor(mins / 60), m = mins % 60;
      return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m`;
    }

    function summarise(path) {
      const km = (path.distance / 1000).toFixed(1);
      const ghTime = fmtTime(path.time);
      const timeStr = path.scored_time_ms != null
        ? `GH ${ghTime} / GPS ${fmtTime(path.scored_time_ms)}`
        : ghTime;
      const tollStr = path.toll_jpy != null ? ` · ¥${path.toll_jpy.toLocaleString()}` : "";
      let chargeStr = "";
      if (path.consumed_kwh?.length) {
        const start = parseFloat(document.getElementById("start-charge").value) || 80;
        const dest  = Math.min(100, Math.max(0, start - path.consumed_kwh.at(-1) / EV_BATTERY_KWH * 100));
        chargeStr = ` · →${dest.toFixed(0)}%`;
      }
      if (path.via_poi) {
        const p = path.via_poi;
        const icon = p.type === "interest" ? interestEmoji : p.type === "hot_spring" ? "♨" : "⚡";
        const extra = p.max_output ? ` ${p.max_output}` : p.description ? ` — ${p.description}` : "";
        return `${km} km · ${timeStr}${tollStr}${chargeStr} · via ${icon} ${p.name}${extra}`;
      }
      return `${km} km · ${timeStr}${tollStr}${chargeStr}`;
    }

    async function resolve(query) {
      const m = query.match(/^(-?\d+\.?\d*),\s*(-?\d+\.?\d*)$/);
      if (m) return [parseFloat(m[1]), parseFloat(m[2])];

      const params = new URLSearchParams({ q: query, format: "json", countrycodes: "jp", limit: 1 });
      const r = await fetch(`${NOMINATIM}?${params}`);
      if (r.ok) {
        const results = await r.json();
        if (results.length) return [parseFloat(results[0].lat), parseFloat(results[0].lon)];
      }

      // Nominatim misses many Japanese street addresses — fall back to GSI geocoding API
      const gsiParams = new URLSearchParams({ q: query });
      const gr = await fetch(`https://msearch.gsi.go.jp/address-search/AddressSearch?${gsiParams}`);
      if (gr.ok) {
        const gsiResults = await gr.json();
        if (gsiResults.length) {
          const [lon, lat] = gsiResults[0].geometry.coordinates;
          return [lat, lon];
        }
      }

      throw new Error(`No results for: ${query}`);
    }

    function pathsToRoutes(paths, strategyIndex) {
      const s = STRATEGIES[strategyIndex];
      return paths.map((path, j) => ({
        coords:       path.points.coordinates,
        summary:      summarise(path),
        label:        (() => {
                        if (!path.via_poi) return j === 0 ? s.label : `${s.label} ${j + 1}`;
                        const poi = path.via_poi;
                        const poiIcon = t => t === "hot_spring" ? "♨" : t === "interest" ? interestEmoji : "⚡";
                        if (poi.waypoints?.length) {
                          return poi.waypoints.map(w => `${poiIcon(w.type)} ${w.name}`).join(" → ");
                        }
                        let lbl = `${poiIcon(poi.type)} ${poi.name}`;
                        if (poi.secondary) lbl += ` → ${poiIcon(poi.secondary.type)} ${poi.secondary.name}`;
                        return lbl;
                      })(),
        strategyIndex,
        via_poi:      path.via_poi || null,
        consumed_kwh: path.consumed_kwh || null,
      }));
    }

    async function fetchStrategy(from, to, strategyIndex, onBatch) {
      const s = STRATEGIES[strategyIndex];
      try {
        const r = await fetch(`${GH}/route`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            points: [[from[1], from[0]], [to[1], to[0]]],
            profile: s.profile,
            start_charge_pct: parseFloat(document.getElementById("start-charge").value) || 80,
            poi_types: document.getElementById("show-onsens").checked
              ? ["charger", "hot_spring"] : ["charger"],
            interest: document.getElementById("interest").value.trim(),
            pinned_stops: pinnedStops,
          }),
        });
        if (!r.ok) return;
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let nl;
          while ((nl = buf.indexOf("\n")) !== -1) {
            const line = buf.slice(0, nl).trim();
            buf = buf.slice(nl + 1);
            if (line) {
              const data = JSON.parse(line);
              if (data.progress) {
                showProgress(data.progress);
                if (data.interest_emoji) interestEmoji = data.interest_emoji;
                if (data.interest_pois?.length) { showInterestPOIs(data.interest_pois); restorePinnedVisuals(); }
                if (data.candidates?.length) setCandidates(data.candidates);
              } else {
                clearCandidates();
                onBatch(pathsToRoutes(data.paths, strategyIndex));
              }
            }
          }
        }
        if (buf.trim()) {
          const data = JSON.parse(buf);
          if (data.progress) {
            showProgress(data.progress);
            if (data.interest_emoji) interestEmoji = data.interest_emoji;
            if (data.interest_pois?.length) { showInterestPOIs(data.interest_pois); restorePinnedVisuals(); }
            if (data.candidates?.length) setCandidates(data.candidates);
          } else {
            clearCandidates();
            onBatch(pathsToRoutes(data.paths, strategyIndex));
          }
        }
      } catch (e) {
        console.warn("fetchStrategy error:", e);
      }
    }

    function fitToAllRoutes() {
      const allCoords = routes.flatMap(r => r.coords);
      if (!allCoords.length) return;
      const bounds = allCoords.reduce(
        (b, c) => b.extend(c),
        new maplibregl.LngLatBounds(allCoords[0], allCoords[0])
      );
      map.fitBounds(bounds, { padding: 60 });
    }

    function _buildHash(fromVal, toVal) {
      const interestVal = document.getElementById("interest").value.trim();
      const params = new URLSearchParams({
        from: fromVal, to: toVal,
        charge: document.getElementById("start-charge").value,
        onsens: document.getElementById("show-onsens").checked ? "1" : "0",
        ...(interestVal ? { interest: interestVal } : {}),
        ...(pinnedStops.length ? {
          pins: JSON.stringify(pinnedStops.map(s => [
            s.type,
            parseFloat(s.lat.toFixed(5)),
            parseFloat(s.lon.toFixed(5)),
            s.data?.name || "",
            s.data?.name_en || "",
          ]))
        } : {}),
      });
      return "#!" + params.toString();
    }

    function _renderRouteList() {
      document.getElementById("route-list").innerHTML = routes.map((r, i) =>
        `<button class="route-btn${i === primaryIndex ? " active" : ""}" onclick="promote(${i})">
           ${r.label} · ${r.summary}
         </button>`
      ).join("");
    }

    async function appendViaStopRoutes() {
      if (!lastFrom || !lastTo) return;
      const motorwayIdx = STRATEGIES.findIndex(s => s.profile === "car_motorway");
      if (motorwayIdx < 0) return;
      const status = document.getElementById("status");
      await fetchStrategy(lastFrom, lastTo, motorwayIdx, (newRoutes) => {
        const toAdd = newRoutes.filter(r => r.via_poi).slice(0, MAX_ROUTES - routes.length);
        if (!toAdd.length) return;
        const startIdx = routes.length;
        routes.push(...toAdd);
        toAdd.forEach((r, j) => {
          const i = startIdx + j;
          setRoute(i, r.coords);
          styleRoute(i, false);
        });
        status.textContent = routes[primaryIndex].summary;
        _renderRouteList();
      });
      clearProgress();
    }

    async function getRoute({ pushHistory = true, keepPinned = false, restoredPins = null } = {}) {
      const status  = document.getElementById("status");
      const fromVal = document.getElementById("from").value.trim();
      const toVal   = document.getElementById("to").value.trim();

      status.textContent = "Geocoding…";
      let from, to;
      try {
        [from, to] = await Promise.all([resolve(fromVal), resolve(toVal)]);
      } catch (e) {
        status.textContent = e.message;
        return;
      }
      lastFrom = from;
      lastTo   = to;

      const url = _buildHash(fromVal, toVal);
      if (pushHistory) history.pushState(null, "", url);
      else history.replaceState(null, "", url);

      // Reset pin visual state (purple markers back to inactive)
      pinnedEls.forEach(el => {
        el.style.cssText = makePoiMarkerEl(el.dataset.emoji || "⚡", false).style.cssText;
        el.dataset.pinned = "";
      });
      pinnedEls.clear();
      if (!keepPinned) pinnedStops = [];
      if (restoredPins) pinnedStops = restoredPins;

      clearRoutes();
      restorePinnedVisuals(); // restore purple for charger/onsen pins already in DOM
      clearProgress();
      routes = [];
      primaryIndex = 0;
      document.getElementById("route-list").innerHTML = "<span style='color:#999;font-size:12px'>Loading…</span>";
      status.textContent = "Routing…";

      let fitted = false;

      function addBatch(newRoutes) {
        const available = MAX_ROUTES - routes.length;
        if (!available) return;
        const toAdd = newRoutes.slice(0, available);
        const startIdx = routes.length;
        routes.push(...toAdd);
        toAdd.forEach((r, j) => {
          const i = startIdx + j;
          setRoute(i, r.coords);
          styleRoute(i, i === 0);
        });
        if (!fitted) { fitted = true; fitToAllRoutes(); }
        status.textContent = routes[0].summary;
        _renderRouteList();
      }

      await Promise.all(STRATEGIES.map((_, i) => fetchStrategy(from, to, i, addBatch)));
      clearProgress();

      if (!routes.length) {
        status.textContent = "No routes found";
        document.getElementById("route-list").innerHTML = "";
      }
    }
  </script>
</body>
