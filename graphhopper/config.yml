graphhopper:
  datareader.file: /home/denbura/working/denbura/data/osm/kanto-latest.osm.pbf
  graph.location: /home/denbura/working/denbura/data/graph-cache

  graph.encoded_values: car_access, car_average_speed, road_access, road_class

  custom_models.directory: /home/denbura/working/denbura/graphhopper

  profiles:
    - name: car
      custom_model_files: [car.json, japan.json]
    - name: car_motorway
      custom_model_files: [car.json, japan_motorway.json]
    - name: car_local
      custom_model_files: [car.json, japan_local.json]
    - name: car_extreme
      custom_model_files: [car.json, japan_extreme.json]

  profiles_ch:
    - profile: car
    - profile: car_motorway
    - profile: car_local
    - profile: car_extreme

  import.osm.ignored_highways: footway,construction,cycleway,path,steps

server:
  application_connectors:
    - type: http
      port: 2027
      bind_host: localhost
  admin_connectors:
    - type: http
      port: 2028
      bind_host: localhost
